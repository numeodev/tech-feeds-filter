name: Update filtered tech feeds (Reddit + Hacker News + Lobsters)

on:
  schedule:
    - cron: "0 * * * *"  # toutes les heures (UTC)
  workflow_dispatch: {}  # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build all feeds
        run: python build_feeds.py

      - name: Commit and push updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.xml
          git diff --quiet --cached || git commit -m "Update feeds [skip ci]"
          git push
